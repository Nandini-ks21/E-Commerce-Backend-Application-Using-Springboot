<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ESHOP — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">ESHOP</span>
      <span class="admin-badge-nav">ADMIN</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Shop</a>
      <a href="admin.html" class="nav-link active">Admin</a>
    </div>
    <div class="nav-actions">
      <span class="user-badge" id="adminUserBadge"></span>
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- ADMIN HEADER -->
  <section class="admin-hero">
    <div class="admin-hero-inner">
      <div class="admin-hero-text">
        <div class="hero-label">Control Panel</div>
        <h1 class="admin-title">Product<br/><em>Management</em></h1>
      </div>
      <div class="admin-stats" id="adminStats">
        <div class="stat-card">
          <div class="stat-num" id="totalProducts">—</div>
          <div class="stat-label">Total Products</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ADD PRODUCT FORM -->
  <section class="admin-section">
    <div class="admin-form-card">
      <div class="form-card-header">
        <h3 id="formTitle">Add New Product</h3>
        <div class="form-mode-badge" id="formModeBadge">NEW</div>
      </div>
      <input type="hidden" id="editProductId"/>
      <div class="admin-form-grid">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="pName" placeholder="e.g. iPhone 15 Pro" class="form-input"/>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="pCategory" placeholder="e.g. Electronics" class="form-input"/>
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="pPrice" placeholder="e.g. 79999" class="form-input"/>
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="pStock" placeholder="e.g. 10" class="form-input"/>
        </div>
        <div class="form-group full-span">
          <label>Image URL</label>
          <input type="text" id="pImageLink" placeholder="https://..." class="form-input"/>
        </div>
        <div class="form-group full-span">
          <label>Description</label>
          <textarea id="pDescription" placeholder="Enter product description (20–200 characters)..." class="form-input form-textarea"></textarea>
        </div>
      </div>
      <div class="error-msg" id="formError"></div>
      <div class="form-actions">
        <button class="btn-primary" onclick="submitProduct()" id="submitBtn">Add Product</button>
        <button class="btn-ghost" onclick="resetForm()" id="cancelBtn" style="display:none">Cancel</button>
      </div>
    </div>
  </section>

  <!-- PRODUCTS TABLE -->
  <section class="admin-section">
    <div class="table-header">
      <h3>All Products</h3>
      <button class="btn-ghost small" onclick="loadAdminProducts()">↻ Refresh</button>
    </div>
    <div class="table-wrap">
      <table class="products-table" id="productsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <tr><td colspan="7" class="table-loading">Loading products…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal-overlay" id="deleteModal" onclick="closeDeleteModal(event)">
    <div class="modal modal-sm">
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
      <div class="delete-icon">⚠</div>
      <h2 class="modal-title">Delete Product?</h2>
      <p class="modal-sub" id="deleteProductName">This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-danger" onclick="confirmDelete()">Delete</button>
        <button class="btn-ghost" onclick="closeDeleteModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <span class="brand-name footer-brand">◈ ESHOP</span>
      <span class="footer-copy">Admin Panel © 2026</span>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
